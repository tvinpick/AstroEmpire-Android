name: Inspect packaged AstroEmpire source

on:
  push:
    branches:
      - fix/map-touch-entities-regression
    paths:
      - .github/workflows/inspect-packaged-source.yml

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract text source from the committed project archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted-project inspected-source
          unzip -q AstroEmpire_Android_Project.zip -d extracted-project
          find extracted-project -type f \
            \( -iname '*.kt' -o -iname '*.java' -o -iname '*.xml' -o -iname '*.gradle' -o -iname '*.gradle.kts' -o -iname '*.js' -o -iname '*.ts' -o -iname '*.tsx' -o -iname '*.jsx' -o -iname '*.html' -o -iname '*.css' -o -iname '*.md' \) \
            -not -path '*/build/*' -not -path '*/.gradle/*' -not -path '*/node_modules/*' \
            -size -8M -print0 | while IFS= read -r -d '' file; do
              relative="${file#extracted-project/}"
              mkdir -p "inspected-source/$(dirname "$relative")"
              cp "$file" "inspected-source/$relative"
          done
          find inspected-source -type f | wc -l

      - name: Make code excerpts and browsable text chunks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("inspected-source/AstroEmpire_Android/app/src/main/assets/index.html")
          s=p.read_text(encoding="utf-8",errors="replace")
          d=Path("inspected-source/diagnostics")
          d.mkdir(parents=True,exist_ok=True)
          for off in range(6400000,len(s),180000):
              (d/f"game_tail_{(off-6400000)//180000:03d}.txt").write_text(s[off:off+180000],encoding="utf-8")
          lines=s.count("\\n")+1
          scripts=list(re.finditer(r"<script\\b[^>]*>(.*?)</script\\s*>",s,re.I|re.S))
          report=[f"HTML chars={len(s)} lines={lines} script_sections={len(scripts)}"]
          report.append("HEAD: "+s[:1200].replace("\\n"," "))
          for j,m in enumerate(scripts):
              report.append(f"SCRIPT {j}: chars={len(m.group(1))}; starts={m.group(1)[:250]}")
              t=m.group(1)
              for k in range(0,len(t),180000):
                  (d/f"script{j:02d}_part{k//180000:03d}.txt").write_text(t[k:k+180000],encoding="utf-8")
          patterns=["pointerdown","pointermove","pointerup","touchstart","touchmove","touchend","mousedown","mousemove","pinch","wheel","gesture","fleet","planet","icon","sprite","localStorage","mapCanvas","worldMap"]
          for name in patterns:
              matches=list(re.finditer(re.escape(name),s,re.I))
              report.append(f"PATTERN {name}: {len(matches)} hits")
              for m in matches[:12]:
                  b=max(0,m.start()-170);e=min(len(s),m.end()+240)
                  report.append(f" {m.start()}: "+s[b:e].replace("\\n"," ")[:420])
          css=s[:s.find("</style>")]
          styles=["#viewport","#world","#scoutLayer",".scout{",".unitShip{",".planetHit{","#fogCanvas","#planetLayer",".planetWrap{","#asteroidLayer","#miniFog"]
          for name in styles:
              matches=list(re.finditer(re.escape(name),css,re.I))
              report.append(f"STYLE {name}: {len(matches)} hits")
              for m in matches[:10]:
                  report.append(f" {m.start()}: "+css[max(0,m.start()-150):m.end()+1200])
          (d/"code-report.txt").write_text("\\n".join(report),encoding="utf-8")
          print(f"scripts={len(scripts)} HTML chars={len(s)} lines={lines}")
          PY
      - name: Commit source on diagnostic branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspected-source/
          if ! git diff --cached --quiet; then
            git commit -m "chore: expose packaged text source for isolated regression fix"
            git push
          fi
