name: Inspect packaged AstroEmpire source

on:
  push:
    branches:
      - fix/map-touch-entities-regression
    paths:
      - .github/workflows/inspect-packaged-source.yml

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract text source from the committed project archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted-project inspected-source
          unzip -q AstroEmpire_Android_Project.zip -d extracted-project
          find extracted-project -type f \
            \( -iname '*.kt' -o -iname '*.java' -o -iname '*.xml' -o -iname '*.gradle' -o -iname '*.gradle.kts' -o -iname '*.js' -o -iname '*.ts' -o -iname '*.tsx' -o -iname '*.jsx' -o -iname '*.html' -o -iname '*.css' -o -iname '*.md' \) \
            -not -path '*/build/*' -not -path '*/.gradle/*' -not -path '*/node_modules/*' \
            -size -512k -print0 | while IFS= read -r -d '' file; do
              relative="${file#extracted-project/}"
              mkdir -p "inspected-source/$(dirname "$relative")"
              cp "$file" "inspected-source/$relative"
          done
          find inspected-source -type f | wc -l
      - name: Commit source on diagnostic branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspected-source/
          if ! git diff --cached --quiet; then
            git commit -m "chore: expose packaged text source for isolated regression fix"
            git push
          fi
